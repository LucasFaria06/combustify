version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: combustify-db
    environment:
      POSTGRES_DB: combustify
      POSTGRES_USER: combustify_user
      POSTGRES_PASSWORD: combustify_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combustify_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: combustify-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
