spring:
  application:
    name: combustify-api-test

  datasource:
    url: jdbc:postgresql://localhost:5434/combustify
    username: combustify_user
    password: combustify_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: localhost
    port: 6379

server:
  port: 8081

jwt:
  secret: "this-is-a-super-secure-jwt-secret-that-is-longer-than-512-bits-for-testing-purposes-only-dont-use-in-production-never-ever-use-this-key-in-production-systems"
  expiration: 86400000
